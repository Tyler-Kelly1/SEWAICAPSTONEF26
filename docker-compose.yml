services:
  postgres:
    image: postgres:16-alpine
    container_name: overload_postgres
    environment:
      POSTGRES_DB: overloaddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
