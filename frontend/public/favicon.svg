<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bar { fill: #4a4639; }
    .plate-inner { fill: #1f1d18; }
    .plate-outer { fill: #b91c1c; }
    .collar { fill: #786f58; }
    @media (prefers-color-scheme: dark) {
      .bar { fill: #e8d89f; }
      .plate-inner { fill: #f6ebd0; }
      .plate-outer { fill: #ef4444; }
      .collar { fill: #cdbe8d; }
    }
  </style>
  <!-- Barbell Shaft -->
  <rect class="bar" x="4" y="22" width="40" height="4" rx="2" />
  
  <!-- Left Weight Plates & Collar -->
  <rect class="plate-outer" x="6" y="14" width="4" height="20" rx="2" />
  <rect class="plate-inner" x="12" y="9" width="5" height="30" rx="2.5" />
  <rect class="collar" x="18.5" y="19" width="3" height="10" rx="1.5" />
  
  <!-- Right Weight Plates & Collar -->
  <rect class="collar" x="26.5" y="19" width="3" height="10" rx="1.5" />
  <rect class="plate-inner" x="31" y="9" width="5" height="30" rx="2.5" />
  <rect class="plate-outer" x="38" y="14" width="4" height="20" rx="2" />
</svg>
